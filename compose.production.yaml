name: mediagnostics

x-logging: &default-logging
  driver: json-file
  options:
    max-file: '3'
    max-size: 10m

x-application-environment: &application-environment
  API_PORT: '3000'
  AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
  AWS_REGION: ${STORAGE_REGION:-us-east-1}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  JOB_TIMEOUT_MS: ${JOB_TIMEOUT_MS:-60000}
  NODE_ENV: production
  PDF_ENCRYPTION_KEY: ${PDF_ENCRYPTION_KEY}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  SESSION_ABSOLUTE_TIMEOUT_MS: ${SESSION_ABSOLUTE_TIMEOUT_MS:-28800000}
  SESSION_IDLE_TIMEOUT_MS: ${SESSION_IDLE_TIMEOUT_MS:-1800000}
  SESSION_SECRET: ${SESSION_SECRET}
  STORAGE_BUCKET: ${STORAGE_BUCKET}
  STORAGE_FORCE_PATH_STYLE: 'false'
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  WEB_ORIGIN: https://${APP_DOMAIN}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    mem_limit: 768m
    cpus: 0.75
    shm_size: 128m
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infrastructure/containers/api.Dockerfile
      target: database-tools
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 512m
    cpus: 0.5
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: infrastructure/containers/api.Dockerfile
      target: runtime
    environment: *application-environment
    networks:
      - edge
      - data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/v1/health/ready').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    mem_limit: 512m
    cpus: 0.75
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/containers/worker.Dockerfile
      target: runtime
    environment: *application-environment
    networks:
      - data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.kill(1,0)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/containers/web.Dockerfile
      target: runtime
    environment:
      API_UPSTREAM: api:3000
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - '80:8080'
      - '443:8443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

networks:
  edge:
  data:

volumes:
  caddy-config:
  caddy-data:
  postgres-data:
  redis-data:
